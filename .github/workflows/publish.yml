name: Publish

on:
  push:
    branches: [master]
  workflow_dispatch:
  repository_dispatch:
    types: [content-changed]

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      CYBERPROXY_SSH_KEY: ${{ secrets.CYBERPROXY_SSH_KEY }}
    steps:
      - name: Clone cyberia-blog into ~/cyber/cyberia-blog
        run: |
          mkdir -p "$HOME/cyber"
          git clone --depth 1 https://github.com/cyberia-to/cyberia-blog.git "$HOME/cyber/cyberia-blog"

      - name: Install Nushell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NU_TAG=$(curl -fsSL --retry 5 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/nushell/nushell/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          NU_VER="${NU_TAG#v}"
          ARCHIVE="nu-${NU_VER}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors "https://github.com/nushell/nushell/releases/download/${NU_TAG}/${ARCHIVE}" -o /tmp/nu.tar.gz
          tar -xzf /tmp/nu.tar.gz -C /tmp
          sudo cp "/tmp/nu-${NU_VER}-x86_64-unknown-linux-gnu/nu" /usr/local/bin/nu
          nu --version

      - name: Clone public subgraphs (the root census and every nested subgraphs.toml)
        run: |
          cd "$HOME/cyber/cyberia-blog"
          nu scripts/sync.nu --public-only --shallow

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Cache optica build
        uses: actions/cache@v4
        with:
          path: |
            /tmp/optica-target-cache
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-optica-v4

      - name: Build optica
        run: |
          rm -rf "$HOME/cyber/optica"
          # pinned to the nested-subgraphs branch until optica#6–#8 land on master: the census
          # declares cyberia's children in cyberia/subgraphs.toml, which only that optica reads
          git clone --depth 1 -b feat/nested-subgraphs https://github.com/cyberia-to/optica.git "$HOME/cyber/optica"
          if [ -d /tmp/optica-target-cache ]; then
            mv /tmp/optica-target-cache "$HOME/cyber/optica/target"
          fi
          cd "$HOME/cyber/optica" && cargo build --release
          cp -r "$HOME/cyber/optica/target" /tmp/optica-target-cache

      - name: Build site
        run: |
          cd "$HOME/cyber/cyberia-blog"
          nu scripts/build.nu --public-only \
            --optica "$HOME/cyber/optica/target/release/optica" \
            --output "$HOME/cyber/cyberia-blog/build"

      - name: Stamp the build
        run: |
          printf 'run %s\nsha %s\nbuilt %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%FT%TZ)" \
            > "$HOME/cyber/cyberia-blog/build/build.txt"

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyberia-blog-site
          path: ~/cyber/cyberia-blog/build
          retention-days: 14

      - name: Deploy to the host that serves cyberia.blog
        if: github.ref == 'refs/heads/master' && env.CYBERPROXY_SSH_KEY != ''
        env:
          FRONT_HOST: ${{ vars.FRONT_HOST }}
        run: |
          # the target is the address cyberia.blog resolves to, so a move of the front needs no edit here.
          # the repo variable FRONT_HOST overrides it — needed once the zone carries more than one A record.
          HOST="$FRONT_HOST"
          if [ -z "$HOST" ]; then
            IPS=$(getent ahostsv4 cyberia.blog | awk '{print $1}' | sort -u)
            if [ "$(printf '%s\n' "$IPS" | grep -c .)" -ne 1 ]; then
              echo "::error::cyberia.blog resolves to [$(echo $IPS)]; expected one address. set the repo variable FRONT_HOST to the primary front"
              exit 1
            fi
            HOST="$IPS"
          fi
          echo "deploy target: $HOST"
          mkdir -p ~/.ssh
          printf '%s\n' "$CYBERPROXY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H "$HOST" >> ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -p 22 -i ~/.ssh/id_ed25519" \
            "$HOME/cyber/cyberia-blog/build/" \
            "cyber@$HOST:/var/www/html/cyberia.blog/"

      - name: Verify cyberia.blog serves this build
        if: github.ref == 'refs/heads/master' && env.CYBERPROXY_SSH_KEY != ''
        run: |
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS -m 20 -H 'Cache-Control: no-cache' "https://cyberia.blog/build.txt?run=$GITHUB_RUN_ID" | sed -n 's/^run //p' || true)
            if [ "$got" = "$GITHUB_RUN_ID" ]; then echo "cyberia.blog serves run $got"; exit 0; fi
            sleep 10
          done
          echo "::error::cyberia.blog serves run '${got:-none}', this run is $GITHUB_RUN_ID — the deploy did not reach the host the domain serves"
          exit 1

      - name: Raise the alarm
        if: failure() && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$HOME/cyber/cyberia-blog/.github/scripts/alert.sh" raise "publish failed"

      - name: Clear the alarm
        if: success() && github.ref == 'refs/heads/master' && env.CYBERPROXY_SSH_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$HOME/cyber/cyberia-blog/.github/scripts/alert.sh" clear
